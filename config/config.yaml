######################################
# GLOBAL RESOURCES 
###################
resources:
  threads: 40
  memory: 180000  # Garde une petite marge sur tes 190 Go
  tmp_dir: "/data/armel/tmp"




# --- Chemins des bases de données ---
kraken_db: "/data/armel/mythesis-data/db/my_k2_db"

# --- Kraaken2 Params ---
kraken_threads: 32
kraken_confidence: 0.1

# --- Bracken Params ---

bracken_read_len: 3000 # 1000 2500 3000 1500
bracken_level: "S, G, F, P"  # S=Espèce, G=Genre, F=Famille

# Paramètres RGI
rgi:
  min_identity: 80
  min_coverage: 80
  model_types:
    - "protein homolog model"
    - "protein variant model"
    - "rRNA gene variant model"
  columns_to_keep:
    - "orf_id"
    - "contig"
    - "best_hit_aro"
    - "aro"
    - "best_identities"
    - "percentage_length_of_reference_sequence"
    - "drug_class"
    - "resistance_mechanism"
    - "amr_gene_family"
    - "model_type"

rgi_bwt:
  min_identity: 80
  min_coverage: 80
  model_types:
    - "protein homolog model"
    - "protein variant model"
    - "rRNA gene variant model"
  columns_to_keep:
    - "aro_term"
    - "aro_accession"
    - "average_percent_identity"
    - "average_percent_coverage"
    - "all_mapped_reads"
    - "drug_class"
    - "resistance_mechanism"
    - "amr_gene_family"
    - "reference_model_type"        # équivalent de model_type

   
# Paramètres de filtrage taxonomique

min_reads_per_taxon: 50      # Minimum 50 reads au total
min_samples_present: 2        # Présent dans au moins 2 échantillons
min_relative_abundance: 0.001 # Minimum 0.1% dans au moins un échantillon

bracken_threshold: 10


# ============================================================================
# FILTRAGE INDÉPENDANT (échantillons hétérogènes)
# ============================================================================

# Un taxon est conservé s'il satisfait ces critères dans AU MOINS 1 échantillon

min_reads_per_sample: 50              # ≥50 reads dans ≥1 échantillon
min_rel_abundance_per_sample: 0.001   # ≥0.1% dans ≥1 échantillon
min_samples_independent: 1            # Accepter singletons robustes
absolute_min_total_reads: 10          # Éliminer bruit absolu (<10 reads partout)

#STRATEGIE DE FILTRATION
filtering_strategy: "independent"   # "standard", "independent", ou "both"

# Figure settings
fig_dpi: 300
fig_top_genera: 15
fig_top_species: 20
fig_heatmap_top_n: 30

priority_pathogens:
  - "Escherichia coli"
  - "Klebsiella pneumoniae"
  - "Pseudomonas aeruginosa"
  - "Clostridioides difficile"
  - "Clostridium perfringens"
  - "Acinetobacter baumannii"
  - "Enterococcus faecium"


mobileog:
  db: "/data/armel/mythesis-data/db/mobileOG-db/mobileOG-db-beatrix-1.6.dmnd"
  metadata: "/data/armel/mythesis-data/db/mobileOG-db/mobileOG-db-beatrix-1.6-All.csv"
  kyanite_py: "/data/armel/mythesis-data/db/mobileOG-db/mobileOG-pl/mobileOGs-pl-kyanite.py"
  k: 15
  evalue: 1e-20
  min_identity: 90
  min_coverage: 90


medaka_model: "r1041_e82_400bps_hac_v5.2.0"


# ─── PlasmidFinder ────────────────────────────────────────────────────────────


plasmidfinder:
  db: "/data/armel/mythesis-data/db/plasmidfinder_db"
  databases: "enterobacteriales,Inc18,NT_Rep,Rep1,Rep2,Rep3,RepA_N,RepL,Rep_trans"
  method_path: "blastn"
  min_cov: 0.60
  threshold: 0.95

icefinder2:
  install_dir: "/data/armel/mythesis-data/tools/icefinder2"
  mode: "Metagenome"
